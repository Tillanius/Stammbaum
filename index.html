<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Familienatlas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px system-ui;background:#f4f1eb;color:#292820}
header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fffdf9;position:relative;z-index:3}
h1{font-size:19px;margin:0 12px 0 0}
button{padding:9px 12px;border:1px solid #d5cdbf;border-radius:9px;background:white;font:inherit}
button.primary{background:#526b5d;color:white}
#board{position:fixed;inset:58px 0 0;overflow:hidden;touch-action:none;background-image:radial-gradient(#cfc6b8 1px,transparent 1px);background-size:22px 22px}
#world{position:absolute;width:3000px;height:2200px;transform-origin:0 0}
svg{position:absolute;inset:0;width:3000px;height:2200px;pointer-events:none}
.person{position:absolute;width:190px;min-height:105px;padding:12px;border:2px solid #879a8c;border-radius:13px;background:var(--bg,#fffdf9);box-shadow:0 5px 18px #30281922;touch-action:none;user-select:none}
.person strong{display:block;overflow-wrap:anywhere}
.dates,.note{font-size:12px;color:#777;margin-top:5px}
.resize{position:absolute;right:0;bottom:0;width:32px;height:32px;touch-action:none;background:linear-gradient(135deg,transparent 48%,#9a907f 49%,#9a907f 55%,transparent 56%,transparent 68%,#9a907f 69%,#9a907f 75%,transparent 76%)}
#panel{display:none;position:fixed;z-index:5;top:70px;left:10px;width:min(330px,calc(100vw - 20px));max-height:80vh;overflow:auto;padding:14px;background:#fffdf9;border:1px solid #ddd;border-radius:13px;box-shadow:0 5px 20px #0002}
#panel.open{display:block}
label{display:block;font-size:12px;color:#777;margin:9px 0 4px}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit}
select[multiple]{height:170px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:13px;color:#666}
#zoom{position:fixed;right:10px;bottom:10px;z-index:4;display:flex;gap:6px}
@media(max-width:600px){
header h1{width:100%}
header button{font-size:12px;padding:8px}
#board{top:94px}
}
</style>
</head>
<body>

<header>
<h1>Familienatlas</h1>
<button class="primary" id="add">＋ Person</button>
<button id="relation">＋ Beziehung</button>
<button id="center">Zentrieren</button>
<button id="export">Export</button>
<label style="margin:0">Import
<input id="file" type="file" accept="application/json" hidden>
</label>
</header>

<div id="board">
<div id="world">
<svg id="lines"></svg>
</div>
</div>

<div id="panel">
<h3 id="heading">Person</h3>

<section id="personForm">
<label>Name</label>
<input id="name">

<label>Geburt</label>
<input id="birth" placeholder="z. B. 1980">

<label>Sterbejahr</label>
<input id="death">

<label>Notiz</label>
<textarea id="note"></textarea>

<label>Kartenfarbe</label>
<select id="color">
<option value="#fffdf9">Creme</option>
<option value="#e5eee7">Salbei</option>
<option value="#e6edf6">Hellblau</option>
<option value="#f5e8d4">Sand</option>
<option value="#f4e5e8">Rosé</option>
</select>

<div class="actions">
<button class="primary" id="save">Speichern</button>
<button id="delete">Löschen</button>
<button id="close">Schließen</button>
</div>
</section>

<section id="relForm" hidden>
<p class="hint">
Wähle mindestens zwei Personen. Bei „Eltern-Kind“ kannst du beispielsweise beide Eltern und ein Kind gemeinsam auswählen. Beziehungen dürfen beliebig viele Personen enthalten.
</p>

<label>Beziehungsart</label>
<select id="type">
<option>Eltern-Kind</option>
<option>Partnerschaft</option>
<option>Geschwister</option>
<option>Verwandtschaft</option>
<option>Andere</option>
</select>

<label>Beteiligte Personen (Mehrfachauswahl)</label>
<select id="members" multiple></select>

<label>Beschriftung (optional)</label>
<input id="relname" placeholder="z. B. Eltern">

<div class="actions">
<button class="primary" id="saveRel">Beziehung speichern</button>
<button id="closeRel">Schließen</button>
</div>
</section>
</div>

<div id="zoom">
<button id="minus">−</button>
<button id="plus">＋</button>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id),
board=$('board'),
world=$('world'),
svg=$('lines'),
panel=$('panel');

let people=[],rels=[],seq=1,edit=null,
scale=1,ox=80,oy=60,pts=new Map(),gesture=null;

const get=id=>people.find(p=>p.id===id);

const store=()=>localStorage.setItem(
'familienatlas-data',
JSON.stringify({people,rels,seq})
);

function transform(){
world.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;
}

function draw(){
world.querySelectorAll('.person').forEach(e=>e.remove());

people.forEach(p=>{
let e=document.createElement('div');
e.className='person';
e.dataset.id=p.id;
e.style.cssText=
`left:${p.x}px;top:${p.y}px;width:${p.w}px;min-height:${p.h}px;--bg:${p.color}`;

let n=document.createElement('strong');
n.textContent=p.name||'Unbenannt';

let d=document.createElement('div');
d.className='dates';
d.textContent=[
p.birth&&'* '+p.birth,
p.death&&'† '+p.death
].filter(Boolean).join(' · ');

let note=document.createElement('div');
note.className='note';
note.textContent=p.note||'Doppeltippen zum Bearbeiten';

let r=document.createElement('div');
r.className='resize';

e.append(n,d,note,r);
e.addEventListener('pointerdown',downCard);
e.addEventListener('dblclick',()=>editPerson(p.id));
world.append(e);
});

drawRelations();
store();
}

function drawRelations(){
svg.innerHTML='';

rels.forEach(r=>{
let a=r.people.map(get).filter(Boolean);
if(a.length<2)return;

let cx=a.reduce((s,p)=>s+p.x+p.w/2,0)/a.length;
let cy=a.reduce((s,p)=>s+p.y+p.h/2,0)/a.length;

a.forEach(p=>{
let l=document.createElementNS(
'http://www.w3.org/2000/svg','line'
);
l.setAttribute('x1',p.x+p.w/2);
l.setAttribute('y1',p.y+p.h/2);
l.setAttribute('x2',cx);
l.setAttribute('y2',cy);
l.setAttribute('stroke','#8b7961');
l.setAttribute('stroke-width','2.5');
svg.append(l);
});

if(r.label||r.type){
let t=document.createElementNS(
'http://www.w3.org/2000/svg','text'
);
t.setAttribute('x',cx+8);
t.setAttribute('y',cy-8);
t.setAttribute('fill','#625746');
t.setAttribute('font-size','13');
t.textContent=r.label||r.type;
svg.append(t);
}
});
}

function show(which){
panel.classList.add('open');
$('personForm').hidden=which!=='person';
$('relForm').hidden=which!=='rel';
$('heading').textContent=
which==='person'?'Person bearbeiten':'Beziehung hinzufügen';
}

function editPerson(id){
let p=get(id);
edit=id;
['name','birth','death','note','color'].forEach(k=>{
$(k).value=p[k]||'';
});
show('person');
}

$('add').onclick=()=>{
edit=null;
['name','birth','death','note'].forEach(k=>$(k).value='');
$('color').value='#fffdf9';
show('person');
};

$('save').onclick=()=>{
let p=edit?get(edit):{
id:seq++,
x:120+(people.length%4)*230,
y:120+Math.floor(people.length/4)*160,
w:190,h:105
};

['name','birth','death','note','color'].forEach(k=>{
p[k]=$(k).value.trim();
});

if(!edit)people.push(p);
panel.classList.remove('open');
draw();
};

$('delete').onclick=()=>{
if(!edit)return;
people=people.filter(p=>p.id!==edit);
rels=rels.filter(r=>!r.people.includes(edit));
edit=null;
panel.classList.remove('open');
draw();
};

$('close').onclick=$('closeRel').onclick=()=>{
panel.classList.remove('open');
};

$('relation').onclick=()=>{
if(people.length<2){
alert('Bitte zuerst mindestens zwei Personen anlegen.');
return;
}

let s=$('members');
s.innerHTML='';

people.forEach(p=>{
let o=document.createElement('option');
o.value=p.id;
o.textContent=p.name;
s.append(o);
});

$('relname').value='';
show('rel');
};

$('saveRel').onclick=()=>{
let ids=[...$('members').selectedOptions].map(o=>+o.value);

if(ids.length<2){
alert('Bitte mindestens zwei Personen auswählen.');
return;
}

rels.push({
type:$('type').value,
label:$('relname').value,
people:ids
});

panel.classList.remove('open');
draw();
};

function downCard(e){
e.stopPropagation();

let p=get(+e.currentTarget.dataset.id);
e.currentTarget.setPointerCapture(e.pointerId);

gesture={
kind:e.target.classList.contains('resize')?'size':'move',
id:p.id,
x:e.clientX,y:e.clientY,
px:p.x,py:p.y,w:p.w,h:p.h
};
}

function downBoard(e){
if(e.target.closest('#panel,header,#zoom'))return;

board.setPointerCapture(e.pointerId);
pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

if(pts.size===1){
gesture={
kind:'pan',
x:e.clientX,y:e.clientY,
ox,oy
};
}

if(pts.size===2){
let a=[...pts.values()];
gesture={
kind:'pinch',
dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),
scale,
mx:(a[0].x+a[1].x)/2,
my:(a[0].y+a[1].y)/2,
ox,oy
};
}
}

board.addEventListener('pointerdown',downBoard);

window.addEventListener('pointermove',e=>{
if(pts.has(e.pointerId)){
pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

if(pts.size===2&&gesture?.kind==='pinch'){
let a=[...pts.values()];
let d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
let m=(a[0].x+a[1].x)/2;
let n=(a[0].y+a[1].y)/2;

let s=Math.max(.3,Math.min(2.2,
gesture.scale*d/gesture.dist));

let wx=(gesture.mx-gesture.ox)/gesture.scale;
let wy=(gesture.my-gesture.oy)/gesture.scale;

scale=s;
ox=m-wx*s;
oy=n-wy*s;
transform();

}else if(pts.size===1&&gesture?.kind==='pan'){
ox=gesture.ox+e.clientX-gesture.x;
oy=gesture.oy+e.clientY-gesture.y;
transform();
}
return;
}

if(!gesture||!['move','size'].includes(gesture.kind))return;

let p=get(gesture.id);
let dx=(e.clientX-gesture.x)/scale;
let dy=(e.clientY-gesture.y)/scale;

if(gesture.kind==='move'){
p.x=Math.max(0,gesture.px+dx);
p.y=Math.max(0,gesture.py+dy);
}else{
p.w=Math.max(150,gesture.w+dx);
p.h=Math.max(90,gesture.h+dy);
}

let el=world.querySelector(`[data-id="${p.id}"]`);
el.style.left=p.x+'px';
el.style.top=p.y+'px';
el.style.width=p.w+'px';
el.style.minHeight=p.h+'px';

drawLinesOnly();
});

function drawLinesOnly(){
svg.innerHTML='';

rels.forEach(r=>{
let a=r.people.map(get).filter(Boolean);
if(a.length<2)return;

let x=a.reduce((s,p)=>s+p.x+p.w/2,0)/a.length;
let y=a.reduce((s,p)=>s+p.y+p.h/2,0)/a.length;

a.forEach(p=>{
let l=document.createElementNS(
'http://www.w3.org/2000/svg','line'
);
[['x1',p.x+p.w/2],['y1',p.y+p.h/2],
['x2',x],['y2',y]].forEach(([k,v])=>l.setAttribute(k,v));
l.setAttribute('stroke','#8b7961');
l.setAttribute('stroke-width','2.5');
svg.append(l);
});
});
}

function up(e){
if(pts.has(e.pointerId)){
pts.delete(e.pointerId);
gesture=null;

if(pts.size===1){
let p=[...pts.values()][0];
gesture={
kind:'pan',
x:p.x,y:p.y,
ox,oy
};
}
return;
}

if(gesture&&['move','size'].includes(gesture.kind)){
store();
}
gesture=null;
}

window.addEventListener('pointerup',up);
window.addEventListener('pointercancel',up);

$('plus').onclick=()=>{
scale=Math.min(2.2,scale*1.2);
transform();
};

$('minus').onclick=()=>{
scale=Math.max(.3,scale/1.2);
transform();
};

$('center').onclick=()=>{
if(!people.length)return;

let x=Math.min(...people.map(p=>p.x));
let y=Math.min(...people.map(p=>p.y));
let X=Math.max(...people.map(p=>p.x+p.w));
let Y=Math.max(...people.map(p=>p.y+p.h));

scale=Math.min(
1.2,
(board.clientWidth-50)/(X-x+80),
(board.clientHeight-50)/(Y-y+80)
);

ox=(board.clientWidth-(x+X)*scale)/2;
oy=(board.clientHeight-(y+Y)*scale)/2;
transform();
};

$('export').onclick=()=>{
let a=document.createElement('a');
let u=URL.createObjectURL(new Blob(
[JSON.stringify({people,rels,seq},null,2)],
{type:'application/json'}
));
a.href=u;
a.download='familienatlas.json';
a.click();
URL.revokeObjectURL(u);
};

$('file').onchange=async e=>{
try{
let d=JSON.parse(await e.target.files[0].text());
people=d.people||[];
rels=d.rels||[];
seq=d.seq||1;
draw();
$('center').click();
}catch{
alert('Datei konnte nicht importiert werden.');
}
};

try{
let d=JSON.parse(localStorage.getItem('familienatlas-data'));
if(d){
people=d.people||[];
rels=d.rels||[];
seq=d.seq||1;
}
}catch{}

draw();
transform();
})();
</script>
</body>
</html>
